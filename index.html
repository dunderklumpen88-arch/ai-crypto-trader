<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Crypto Trader v6</title>
<style>
body{font-family:Arial,sans-serif;background:#0d1117;color:#fff;margin:0;padding:16px}h1{font-size:25px}.card{background:#171d26;border-radius:16px;padding:15px;margin:10px 0}.ok{color:#52e08b}.bad{color:#ff7070}.big{font-size:22px;font-weight:700}button{width:100%;padding:18px;border:0;border-radius:14px;font-size:19px;font-weight:700;margin:6px 0}#start{background:#32c875}#stop{background:#e05252;color:#fff}.row{display:flex;justify-content:space-between;margin:8px 0}.signal{padding:10px;border-bottom:1px solid #29313d}.buy{color:#53e28c}.sell{color:#ff7070}.wait{color:#f3c969}.small{font-size:12px;color:#aeb8c5}
</style></head><body>
<h1>🤖 AI Crypto Trader v6</h1>
<div class="card"><div class="row">Backend <b id="backend">...</b></div><div class="row">Coinbase <b id="cb">...</b></div><div class="row">Läge <b>PAPER</b></div><div class="row">Coins <b id="coins">...</b></div><div class="row">Autotrade <b id="run">...</b></div></div>
<div class="card"><div class="big">💰 <span id="equity">0</span> kr</div><div>Resultat: <b id="result">0</b> kr</div><div class="small">Virtuellt startkapital: 1 000 kr · max 25% per position</div></div>
<button id="start" onclick="start()">▶ STARTA PAPER AUTOTRADE</button><button id="stop" onclick="stop()">■ STOPPA</button>
<div class="card"><div class="big">🏆 Bästa signal</div><div id="best">Laddar...</div></div>
<div class="card"><div class="big">📊 Marknader</div><div id="list">Laddar...</div></div>
<div class="card"><div class="big">🧾 Senaste affärer</div><div id="trades">Inga affärer ännu.</div></div>
<script>
const API="https://ai-crypto-trader-f8cz.onrender.com";
async function get(u,o){let r=await fetch(API+u,o);return await r.json()}
async function refresh(){
 try{
  let s=await get("/api/status"), sc=await get("/api/scan"), p=await get("/api/paper/status");
  backend.textContent=s.backend; backend.className="ok"; cb.textContent=s.coinbase; cb.className=s.coinbase=="OK"?"ok":"bad";
  coins.textContent=sc.count; run.textContent=p.running?"AKTIV":"STOPPAD"; run.className=p.running?"ok":"bad";
  equity.textContent=Math.round(p.equity_sek).toLocaleString("sv-SE"); result.textContent=Math.round(p.result_sek).toLocaleString("sv-SE");
  if(sc.best){let b=sc.best;best.innerHTML=`<b>${b.product}</b> · <span class="${b.signal=="KÖP"?"buy":b.signal=="SÄLJ"?"sell":"wait"}">${b.signal}</span> · ${b.confidence}% · RSI ${b.rsi}`;} else best.textContent="Ingen signal – kontrollera Coinbase.";
  list.innerHTML=sc.signals.map(x=>`<div class="signal"><b>${x.product}</b> · ${x.price_sek?Math.round(x.price_sek).toLocaleString("sv-SE")+" kr":"-"} · <span class="${x.signal=="KÖP"?"buy":x.signal=="SÄLJ"?"sell":"wait"}">${x.signal}</span> · ${x.confidence}%</div>`).join("")||"Inga marknader.";
  trades.innerHTML=p.trades.length?p.trades.slice().reverse().map(t=>`<div class="signal">${t.side} · <b>${t.product}</b> · ${t.sek} kr</div>`).join(""):"Inga affärer ännu.";
 }catch(e){backend.textContent="FEL";backend.className="bad"}
}
async function start(){await get("/api/paper/start",{method:"POST"});refresh()}
async function stop(){await get("/api/paper/stop",{method:"POST"});refresh()}
refresh();setInterval(refresh,10000);
</script></body></html>
