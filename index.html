<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Crypto Trader</title>
<style>body{margin:0;background:#0b1020;color:#eee;font-family:Arial}.w{max-width:760px;margin:auto;padding:16px}.c{background:#151d32;border:1px solid #293550;border-radius:16px;padding:16px;margin:12px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:bold;font-size:17px}.go{background:#22c55e}.stop{background:#ef4444;color:white}.row,.market{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #293550}.big{font-size:28px;font-weight:bold}.muted{color:#9ca3af}</style></head><body><div class="w">
<div class="c"><h1>🤖 AI Crypto Trader</h1><div class="muted">SPOT • PAPER TEST</div></div>
<div class="c"><b id="backend">Backend: …</b><br><b id="coinbase">Coinbase: …</b><button id="btn" class="go" onclick="toggle()">STARTA TESTLÄGET</button></div>
<div class="c"><h2>💰 Resultat</h2><div class="row"><span>Kontanter</span><b id="cash">1 000 kr</b></div><div class="row"><span>Totalt</span><b id="eq">1 000 kr</b></div><div class="row"><span>Resultat</span><b id="pnl">0 kr (0%)</b></div><div class="row"><span>Senaste</span><b id="act">–</b></div></div>
<div class="c"><h2>🎯 Bästa signal</h2><div id="best" class="big">AVVAKTA</div><div id="info" class="muted">Laddar…</div></div>
<div class="c"><h2>📊 Marknader</h2><div id="markets">Laddar…</div></div>
<div class="c"><h2>🧾 Affärer</h2><div id="trades">Inga ännu.</div></div>
<div class="c muted">🔒 Endast paper trading. Inga riktiga order, inga uttag, ingen hävstång.</div></div>
<script>const API="https://ai-crypto-trader-f8cz.onrender.com";const money=x=>Number(x||0).toLocaleString("sv-SE",{maximumFractionDigits:2})+" kr";
async function j(p,o){let r=await fetch(API+p,o);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function render(d){cash.textContent=money(d.cash);eq.textContent=money(d.equity);pnl.textContent=money(d.pnl_sek)+" ("+Number(d.pnl_pct||0).toFixed(2)+"%)";act.textContent=d.last_action||"–";let b=d.best;if(b){best.textContent=b.product_id+" – "+b.signal;info.textContent="Pris "+b.price+" EUR • "+b.confidence+"% • RSI "+b.rsi+" • "+b.reason}else{best.textContent="AVVAKTA";info.textContent=d.last_error||"Väntar på data"}markets.innerHTML=(d.markets||[]).map(m=>`<div class="market"><span><b>${m.product_id}</b> ${m.signal}</span><span>${m.confidence}% / ${m.score}</span></div>`).join("")||"Ingen data";trades.innerHTML=(d.trades||[]).slice().reverse().map(t=>`<div class="row"><span>${t.side} ${t.product_id}</span><span>${money(t.value)}</span></div>`).join("")||"Inga ännu.";btn.textContent=d.running?"STOPPA TESTLÄGET":"STARTA TESTLÄGET";btn.className=d.running?"stop":"go"}
async function refresh(){try{let s=await j("/api/status");backend.innerHTML="Backend: 🟢 ANSLUTEN";coinbase.innerHTML=s.coinbase_credentials_configured?"Coinbase: 🟢 ANSLUTEN":"Coinbase: 🔴 SAKNAS";}catch(e){backend.innerHTML="Backend: 🔴 FEL"}try{render(await j("/api/paper/tick"))}catch(e){act.textContent="Backend svarar inte ännu"}}
async function toggle(){let s=await j("/api/paper/status");render(await j(s.running?"/api/paper/stop":"/api/paper/start",{method:"POST"}))}
refresh();setInterval(refresh,60000)</script></body></html>
