<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Crypto Trader v5</title>
<style>
body{font-family:Arial,sans-serif;background:#101216;color:#fff;margin:0;padding:16px}
h1{font-size:25px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1b1f27;border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:20px;font-weight:700}.muted{color:#aeb6c2;font-size:13px}
button{width:100%;padding:18px;border:0;border-radius:14px;font-size:18px;font-weight:700;margin:6px 0}
.start{background:#25c26e;color:#07130c}.stop{background:#e54b4b;color:white}
.ok{color:#42e58a}.bad{color:#ff7070}.yellow{color:#ffd35a}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #303641;text-align:left}
#err{white-space:pre-wrap}
</style>
</head>
<body>
<h1>🤖 AI Crypto Trader v5</h1>
<div class="grid">
 <div class="card"><div class="muted">Backend</div><div id="backend" class="big">...</div></div>
 <div class="card"><div class="muted">Coinbase</div><div id="coinbase" class="big">...</div></div>
 <div class="card"><div class="muted">Läge</div><div id="mode" class="big">PAPER</div></div>
 <div class="card"><div class="muted">Autotrade</div><div id="run" class="big yellow">AV</div></div>
</div>
<div class="card">
 <button class="start" onclick="startBot()">▶ STARTA AUTOTRADE</button>
 <button class="stop" onclick="stopBot()">■ STOPPA</button>
 <div id="msg" class="muted">PAPER-läge: inga riktiga pengar används.</div>
</div>
<div class="grid">
 <div class="card"><div class="muted">Kontanter</div><div id="cash" class="big">0 kr</div></div>
 <div class="card"><div class="muted">Kontovärde</div><div id="eq" class="big">0 kr</div></div>
 <div class="card"><div class="muted">Resultat</div><div id="res" class="big">0 kr</div></div>
 <div class="card"><div class="muted">Coins</div><div id="coins" class="big">0</div></div>
</div>
<div class="card">
 <div class="muted">Bästa signal</div>
 <div id="best" class="big">AVVAKTA</div>
 <div id="bestinfo" class="muted"></div>
</div>
<div class="card">
 <div class="muted">Senaste heartbeat</div><div id="heartbeat">-</div>
 <div class="muted" style="margin-top:8px">Fel</div><div id="err">Inget</div>
</div>
<div class="card">
 <div class="muted">Marknader</div>
 <table><thead><tr><th>Coin</th><th>Signal</th><th>Poäng</th><th>Pris</th></tr></thead><tbody id="markets"></tbody></table>
</div>
<script>
const API="https://ai-crypto-trader-f8cz.onrender.com";
const sek=n=>(Number(n||0)).toLocaleString("sv-SE",{maximumFractionDigits:2})+" kr";
async function j(url,opt){const r=await fetch(API+url,opt);return await r.json()}
async function refresh(){
 try{
  const [s,p,sc]=await Promise.all([j("/api/status"),j("/api/paper/status"),j("/api/scan")]);
  backend.textContent=s.backend; backend.className=s.backend==="ONLINE"?"big ok":"big bad";
  coinbase.textContent=s.coinbase; coinbase.className=s.coinbase==="OK"?"big ok":"big yellow";
  mode.textContent="PAPER";
  run.textContent=p.running?"🟢 AKTIV":"🔴 STOPPAD"; run.className=p.running?"big ok":"big bad";
  cash.textContent=sek(p.cash_sek); eq.textContent=sek(p.equity_sek); res.textContent=sek(p.result_sek);
  coins.textContent=sc.count||0;
  if(!sc.count) msg.textContent="Inga marknader hämtades från Coinbase. Kontrollera Render/API-anslutningen.";
  const b=sc.best||{}; best.textContent=(b.coin||"-")+" — "+(b.signal||"AVVAKTA");
  bestinfo.textContent="Säkerhet "+(b.confidence||50)+"%";
  heartbeat.textContent=p.last_tick||"-";
  err.textContent=p.last_error||s.last_error||"Inget";
  markets.innerHTML=(sc.markets||[]).map(x=>`<tr><td>${x.coin||"-"}</td><td>${x.signal||"-"}</td><td>${x.score??0}</td><td>${x.price_sek?sek(x.price_sek):"-"}</td></tr>`).join("");
 }catch(e){err.textContent="Appfel: "+e}
}
async function startBot(){
 msg.textContent="Startar AUTOTRADE...";
 try{const r=await j("/api/paper/start",{method:"POST"});msg.textContent=r.message||"AUTOTRADE ACTIVE";}catch(e){msg.textContent="Kunde inte starta: "+e}
 await refresh();
}
async function stopBot(){
 msg.textContent="Stoppar...";
 try{await j("/api/paper/stop",{method:"POST"});msg.textContent="AUTOTRADE STOPPAD";}catch(e){msg.textContent="Kunde inte stoppa: "+e}
 await refresh();
}
refresh(); setInterval(refresh,15000);
</script>
</body>
</html>
